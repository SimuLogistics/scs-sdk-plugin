name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            file: Release/scs-telemetry.dll
            out: SimuLogistics-Telemetry.dll
            configure: -A x64
          # Oldest supported image, so the .so runs on older glibc versions.
          - os: ubuntu-22.04
            name: linux-x64
            file: libscs-telemetry.so
            out: SimuLogistics-Telemetry.so
            configure: -DCMAKE_BUILD_TYPE=Release
          # The macOS game runs as x86_64, so build for that architecture.
          - os: macos-latest
            name: macos-x64
            file: libscs-telemetry.dylib
            out: SimuLogistics-Telemetry.dylib
            configure: -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -S . -B build ${{ matrix.configure }}

      - name: Build
        run: cmake --build build --config Release

      - name: Smoke test
        working-directory: build
        run: ctest -C Release --output-on-failure

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp "build/${{ matrix.file }}" "dist/${{ matrix.out }}"

      - uses: actions/upload-artifact@v7
        with:
          name: SimuLogistics-Telemetry-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    # Pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
